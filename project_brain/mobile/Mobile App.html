<script type="text/babel">
const { useState } = React;

const PHONE_W = 340, PHONE_H = 720;

// role color coding for gallery labels
const ROLE_COLORS = {
  Inspector: '#0d9488', Viewer: '#64748b', Auditor: '#7c3aed', Manager: '#2563eb', Admin: '#b45309', All: '#18181b',
};
const RoleTag = ({ r }) => (
  <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, height: 20, padding: '0 8px', borderRadius: 999,
    background: 'var(--bg-subtle)', color: 'var(--text-muted)', fontSize: 11, fontWeight: 600 }}>
    <span style={{ width: 7, height: 7, borderRadius: '50%', background: ROLE_COLORS[r] || '#999' }}/>{r}
  </span>
);
const DeviceTag = ({ d }) => {
  const map = { iOS: '#0071e3', Android: '#3ddc84', 'iOS + Android': '#8b5cf6', Tablet: '#f59e0b' };
  return <span style={{ height: 20, padding: '0 8px', borderRadius: 999, background: 'var(--bg-subtle)', color: 'var(--text-muted)', fontSize: 11, fontWeight: 700, display: 'inline-flex', alignItems: 'center', gap: 5 }}>
    <span style={{ width: 7, height: 7, borderRadius: 2, background: map[d] || '#999' }}/>{d}</span>;
};

// ── Device frame wrappers ──
function PhoneFrame({ platform, dark, children }) {
  const content = <div style={{ height: '100%' }}>{children}</div>;
  if (platform === 'android') {
    return <div className="phone-shadow-android" style={{ borderRadius: 26, overflow: 'hidden' }}>
      <AndroidDevice width={PHONE_W} height={PHONE_H} dark={dark}>{content}</AndroidDevice></div>;
  }
  return <div className="phone-shadow" style={{ borderRadius: 50, overflow: 'hidden' }}>
    <IOSDevice width={PHONE_W} height={PHONE_H} dark={dark}>{content}</IOSDevice></div>;
}

function ThemedPhone({ Comp, platform, dark, forceDark, extra }) {
  const isDark = forceDark ? true : dark;
  const T = mkTheme(isDark);
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 10 }}>
      <span style={{ fontSize: 11, fontWeight: 600, color: 'var(--text-subtle)', textTransform: 'uppercase', letterSpacing: '0.08em' }}>{forceDark ? 'Capture' : isDark ? 'Dark' : 'Light'}</span>
      <PhoneFrame platform={platform} dark={isDark}><Comp T={T} platform={platform} {...(extra || {})}/></PhoneFrame>
    </div>
  );
}

// scaled tablet
function ThemedTablet({ Comp, dark }) {
  const T = mkTheme(dark);
  const W = 1000, H = 750, scale = 0.66;
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 10 }}>
      <span style={{ fontSize: 11, fontWeight: 600, color: 'var(--text-subtle)', textTransform: 'uppercase', letterSpacing: '0.08em' }}>{dark ? 'Dark · landscape' : 'Light · landscape'}</span>
      <div style={{ width: W * scale + 28, height: H * scale + 28 }}>
        <div style={{ transform: `scale(${scale})`, transformOrigin: 'top left' }}>
          <TabletFrame width={W} height={H} dark={dark} landscape><Comp T={T}/></TabletFrame>
        </div>
      </div>
    </div>
  );
}

// ── Cover ──
function Cover() {
  const surfaces = [
    { r: 'Inspector', s: 'Home · My Tasks · Inspections · Quick-Log · Camera/Voice · NCR create + detail · Notifications · Settings' },
    { r: 'Viewer', s: 'Read-only Home + records they may see · Notifications · Settings' },
    { r: 'Auditor', s: 'Inspections (view) · NCR view + verify · 8D follow-up · read-oriented dashboard' },
    { r: 'Manager', s: 'All Inspector surfaces + Approvals · Assign/reassign · Team & plant · 8D · CAPA' },
    { r: 'Admin', s: 'Everything + Workspace pulse + read-only audit highlights + “Manage in web app”' },
  ];
  return (
    <div style={{ maxWidth: 940, margin: '0 auto', padding: '8px 8px 48px' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
        <span style={{ color: 'var(--accent)' }}><Icon name="logo" size={30}/></span>
        <span style={{ fontSize: 20, fontWeight: 800, letterSpacing: '0.12em' }}>KAENAL</span>
        <span style={{ fontSize: 13, color: 'var(--text-muted)', fontWeight: 600 }}>· Mobile & Tablet</span>
      </div>
      <div style={{ fontSize: 34, fontWeight: 800, letterSpacing: '-0.03em', marginTop: 22, lineHeight: 1.1 }}>
        The QMS field app — native, offline-first, role-aware.
      </div>
      <div style={{ fontSize: 15, color: 'var(--text-muted)', marginTop: 12, maxWidth: 680, lineHeight: 1.6 }}>
        Expo (iOS + Android) with NativeWind, sharing the web app's data layer and status vocabulary.
        Inspectors run checks and raise NCRs on the floor; managers approve and assign; admins supervise —
        the UI is curated by role while the server enforces every capability. A pixel-for-pixel binding
        reference, not shipped code.
      </div>

      {/* offline model */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginTop: 30 }}>
        <div style={{ border: '1px solid var(--border)', borderRadius: 'var(--r-xl)', background: 'var(--surface)', padding: 20 }}>
          <div className="k-overline" style={{ marginBottom: 10 }}>Offline-first model</div>
          <ul style={{ margin: 0, paddingLeft: 18, fontSize: 13.5, color: 'var(--text)', lineHeight: 1.8 }}>
            <li>Persistent <strong>sync pill</strong> in every header: Synced · Pending · Failed · Offline.</li>
            <li>Offline completion is confirmed in <strong>green</strong> — “Saved on device — will sync”.</li>
            <li>Dedicated sync queue with storage gauge and one-tap <strong>conflict resolve</strong>.</li>
            <li>Fieldwork is never blocked on connectivity.</li>
          </ul>
        </div>
        <div style={{ border: '1px solid var(--border)', borderRadius: 'var(--r-xl)', background: 'var(--surface)', padding: 20 }}>
          <div className="k-overline" style={{ marginBottom: 10 }}>Native standards</div>
          <ul style={{ margin: 0, paddingLeft: 18, fontSize: 13.5, color: 'var(--text)', lineHeight: 1.8 }}>
            <li>Bottom tab bar (thumb-reach) with badges; FAB for capture/raise.</li>
            <li>iOS HIG large titles & sheets · Android Material 3 top bar & FAB.</li>
            <li>Safe areas: notch / Dynamic Island / home indicator / gesture nav.</li>
            <li>Empty · loading · error · offline states; ≥44pt targets; WCAG AA.</li>
          </ul>
        </div>
      </div>

      {/* role → surface */}
      <div style={{ border: '1px solid var(--border)', borderRadius: 'var(--r-xl)', background: 'var(--surface)', padding: 20, marginTop: 16 }}>
        <div className="k-overline" style={{ marginBottom: 12 }}>Role → surface map (RBAC · presentation only)</div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {surfaces.map(x => (
            <div key={x.r} style={{ display: 'flex', gap: 12, alignItems: 'flex-start' }}>
              <div style={{ width: 96, flexShrink: 0 }}><RoleTag r={x.r}/></div>
              <div style={{ fontSize: 13, color: 'var(--text-muted)', lineHeight: 1.5 }}>{x.s}</div>
            </div>

        <div style={{ fontSize: 12, color: 'var(--text-subtle)', marginTop: 12, lineHeight: 1.5 }}>
          External partner/supplier is web-only and not a user of this app. When a role lacks a capability the action is <strong>absent</strong>, not a disabled teaser.
        </div>
      </div>

      {/* legend */}
      <div style={{ display: 'flex', gap: 24, marginTop: 20, flexWrap: 'wrap' }}>
        <div>
          <div className="k-overline" style={{ marginBottom: 8 }}>Devices</div>

// ── Stage ──
function Stage({ scene, view }) {
  if (scene.cover) return <Cover/>;
  const themes = view === 'dark' ? [true] : view === 'light' ? [false] : [false, true];

  let frames;
  if (scene.tablet) {
    frames = themes.map(d => <ThemedTablet key={String(d)} Comp={scene.comp} dark={d}/>);
  } else if (scene.platforms) {
    // iOS vs Android comparison — single (first) theme to keep it side-by-side
    const d = themes[0];
    frames = scene.platforms.map(p => (
      <div key={p} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 10 }}>
        <span style={{ fontSize: 11, fontWeight: 700, color: 'var(--text-subtle)', textTransform: 'uppercase', letterSpacing: '0.08em' }}>{p === 'ios' ? 'iOS · HIG' : 'Android · Material 3'}</span>
        <PhoneFrame platform={p} dark={d}>{React.createElement(scene.comp, { T: mkTheme(d), platform: p })}</PhoneFrame>
      </div>
    ));
  } else {
    frames = themes.map(d => <ThemedPhone key={String(d)} Comp={scene.comp} platform={scene.platform} dark={d} forceDark={scene.forceDark} extra={scene.props}/>);
  }

  return (
    <div style={{ display: 'flex', gap: 40, flexWrap: 'wrap', justifyContent: 'center', padding: '8px 0 40px' }}>
      {frames}
    </div>
  );
}

function App() {
  const [active, setActive] = useState('cover');
  const [view, setView] = useState('both');
  const scene = ALL.find(s => s.id === active);

  return (
    <div style={{ display: 'flex', height: '100vh', overflow: 'hidden', background: 'var(--bg)' }}>
      {/* Navigator */}
      <div style={{ width: 272, flexShrink: 0, borderRight: '1px solid var(--border)', background: 'var(--surface)', overflowY: 'auto', padding: '18px 12px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 9, padding: '0 8px 2px' }}>
          <span style={{ color: 'var(--accent)' }}><Icon name="logo" size={20}/></span>
          <span style={{ fontSize: 14, fontWeight: 800, letterSpacing: '0.08em' }}>KAENAL</span>
        </div>
        <div style={{ padding: '0 8px 16px', fontSize: 11.5, color: 'var(--text-muted)' }}>Mobile & tablet — screens by role</div>
        {GROUPS.map(grp => (
          <div key={grp.g} style={{ marginBottom: 14 }}>
            <div className="k-overline" style={{ padding: '0 8px 6px' }}>{grp.g}</div>
            {grp.items.map(it => (
              <button key={it.id} className="navbtn" onClick={() => setActive(it.id)} style={{
                display: 'flex', alignItems: 'center', gap: 8, width: '100%', padding: '7px 10px',
                borderRadius: 'var(--r-md)', background: active === it.id ? 'var(--accent-soft)' : 'transparent',
                color: active === it.id ? 'var(--accent)' : 'var(--text)', fontSize: 12.5, fontWeight: 500,
                textAlign: 'left', marginBottom: 1, border: 'none',
              }}>
                <span style={{ width: 6, height: 6, borderRadius: '50%', background: active === it.id ? 'var(--accent)' : 'var(--border-strong)', flexShrink: 0 }}/>
                <span style={{ flex: 1 }}>{it.label}</span>
              </button>
            ))}
          </div>
        ))}
      </div>

      {/* Stage */}
      <div style={{ flex: 1, minWidth: 0, overflowY: 'auto' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '14px 28px', borderBottom: '1px solid var(--border)', background: 'var(--surface)', position: 'sticky', top: 0, zIndex: 5 }}>
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 15, fontWeight: 700 }}>{scene.label}</div>
            {scene.desc && <div style={{ fontSize: 12.5, color: 'var(--text-muted)', marginTop: 2, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', maxWidth: 560 }}>{scene.desc}</div>}
          </div>
          <div style={{ flex: 1 }}/>
          <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
            {scene.device && <DeviceTag d={scene.device}/>}
            {scene.roles && scene.roles.map(r => <RoleTag key={r} r={r}/>)}
          </div>
          {!scene.cover && !scene.platforms && (
            <div style={{ display: 'flex', border: '1px solid var(--border)', borderRadius: 'var(--r-md)', overflow: 'hidden', marginLeft: 6 }}>
              {['light', 'dark', 'both'].map(v => (
                <button key={v} onClick={() => setView(v)} style={{
                  padding: '6px 11px', fontSize: 12, fontWeight: 600, border: 'none',
                  background: view === v ? 'var(--accent)' : 'var(--surface)',
                  color: view === v ? 'var(--accent-fg)' : 'var(--text-muted)', textTransform: 'capitalize',
                }}>{v}</button>
              ))}
            </div>
          )}
        </div>
        <div style={{ padding: 28, background: 'radial-gradient(circle at 50% 0%, var(--bg-subtle), var(--bg) 70%)', minHeight: 'calc(100vh - 60px)' }}>
          <Stage scene={scene} view={view}/>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
