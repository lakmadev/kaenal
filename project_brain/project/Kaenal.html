<style>
  /* ============================================================
     RESPONSIVE LAYER — reflows the (otherwise fixed-1280) app for
     tablet & phone. The app is inline-styled, so these rules use
     !important to win over inline `style` attributes, matched on
     their serialized substrings (e.g. [style*="repeat(4, 1fr)"]).
     ============================================================ */

  /* Never let a stray wide element scroll the whole page sideways;
     tables/long content get their own internal scroll instead.
     `clip` on <html> is the real backstop (it's the element that
     scrolls); it doesn't break the sticky sidebar the way hidden can. */
  html { overflow-x: clip; }
  html, body { max-width: 100%; }
  body { overflow-x: hidden; }

  /* ---------- TABLET (≤ 1024px) ---------- */
  @media (max-width: 1024px) {
    /* Big KPI strips: 4/5/6-up → 2-up */
    main [style*="repeat(4, 1fr)"]:not([style*="auto-fit"]):not([style*="auto-fill"]),
    main [style*="repeat(5, 1fr)"]:not([style*="auto-fit"]):not([style*="auto-fill"]):not([style*="gap: 4px"]),
    main [style*="repeat(6, 1fr)"]:not([style*="auto-fit"]):not([style*="auto-fill"]):not(.k-heatmap-grid) {
      grid-template-columns: repeat(2, 1fr) !important;
    }
    /* Fixed side-rail two-pane layouts → stack */
    main [style*="px 28px"][style*="320px"],
    main [style*="px 28px"][style*="322px"],
    main [style*="px 28px"][style*="300px"],
    main [style*="1fr 280px"],
    main [style*="1fr 320px"],
    main [style*="320px 1fr"],
    main [style*="300px 1fr"],
    main [style*="380px 1fr"],
    main [style*="322px"],
    main [style*="300px"][style*="grid-template-columns"] {
      grid-template-columns: 1fr !important;
    }
  }

  /* ---------- PHONE (≤ 720px) ---------- */
  @media (max-width: 720px) {
    /* Collapse ALL fixed multi-column grids in the page body to a
       single column. Leaves auto-fit/auto-fill grids (already
       responsive) and the 5×5 risk heat-map (tight gap:4px) intact. */
    main [style*="grid-template-columns"]:not([style*="auto-fit"]):not([style*="auto-fill"]) {
      grid-template-columns: 1fr !important;
    }
    /* Widgets/tiles use explicit grid-column spans (e.g. "span 6", "1 / 3")
       which would otherwise force implicit columns back open. Reset every
       explicit placement so items stack in the single column. */
    main [style*="grid-column"] { grid-column: auto !important; }
    main [style*="grid-row"] { grid-row: auto !important; }
    /* Re-protect the 5×5 risk heat-map + its axis labels (id-:not bumps
       specificity so this wins over the blanket rule above). */
    main [style*="repeat(5, 1fr)"][style*="gap: 4px"]:not(#_) {
      grid-template-columns: repeat(5, 1fr) !important;
    }
    /* Risk heatmap (area × category matrix) must stay a matrix: restore its
       columns with a narrower label rail so 6 cells fit a phone width. */
    main .k-heatmap-grid:not(#_) { grid-template-columns: 52px repeat(6, 1fr) !important; }
    main .k-heatmap-grid .k-heatmap-rowlabel { font-size: 9.5px !important; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Tighten page gutters: every page wrapper uses `<v>px 28px ...` */
    main [style*="px 28px"] {
      padding-left: 16px !important;
      padding-right: 16px !important;
    }

    /* Tables scroll horizontally instead of forcing the page wide. */
    .k-table {
      display: block;
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      white-space: nowrap;
    }

    /* Fixed-width form controls shouldn't overflow the viewport. */
    main .k-input { max-width: 100%; }

    /* Horizontal toolbar / filter rows (Segmented + search + actions,
       often with a `margin-left:auto` spacer) must wrap instead of
       pushing content off-screen. Only horizontal flex rows are
       affected; flex-wrap is a no-op until content actually overflows. */
    main [style*="display: flex"]:not([style*="flex-direction: column"]) {
      flex-wrap: wrap !important;
    }
    /* Neutralize right-aligning spacers so controls reflow to the left. */
    main [style*="margin-left: auto"] { margin-left: 0 !important; }

    /* ----- Condense the top bar ----- */
    header { padding-left: 12px !important; padding-right: 12px !important; gap: 8px !important; }
    /* Show only the current-page breadcrumb */
    header > nav > * { display: none !important; }
    header > nav > button:last-child { display: inline-block !important; }
    /* Search collapses to an icon button */
    header [style*="width: 400px"] { width: auto !important; min-width: 0 !important; padding: 0 10px !important; }
    header [style*="width: 400px"] > span,
    header [style*="width: 400px"] > kbd { display: none !important; }
    /* Hide the name/role text next to the avatar */
    header [aria-haspopup="menu"] > div { display: none !important; }
  }
</style>

  'suppliers-risk': [{ label: 'Supply chain' }, { label: 'Suppliers', route: 'suppliers' }, { label: 'Risk matrix' }],
  'supplier-detail': [{ label: 'Supply chain' }, { label: 'Suppliers', route: 'suppliers' }, { label: 'Detail' }],
  'ppap': [{ label: 'Supply chain' }, { label: 'PPAP submissions' }],
  'ppap-detail': [{ label: 'Supply chain' }, { label: 'PPAP submissions', route: 'ppap' }, { label: 'Detail' }],
  'scar': [{ label: 'Supply chain' }, { label: 'SCAR & chargebacks' }],
};

function App() {
  const [route, _setRoute] = useState(() => localStorage.getItem('k_route') || 'dashboard');
  const [ncrId, setNcrId] = useState(() => localStorage.getItem('k_ncr') || 'NCR-2026-0142');
  const [eightDId, set8dId] = useState(() => localStorage.getItem('k_8d') || '8D-2026-0015');
  const [inspectionId, setInspectionId] = useState(() => localStorage.getItem('k_insp') || 'INS-2026-0342');
  const [auditId, setAuditId] = useState(() => localStorage.getItem('k_audit') || 'AUD-2026-0021');
  const [capaId, setCapaId] = useState(() => localStorage.getItem('k_capa') || 'CAPA-2026-0042');
  const [docId, setDocId] = useState(() => localStorage.getItem('k_doc') || 'D-001');
  const [reportId, setReportId] = useState(() => localStorage.getItem('k_report') || 'r1');
  const [templateId, setTemplateId] = useState(() => localStorage.getItem('k_template') || 'iatf-process-audit-v2');
  const [supplierId, setSupplierId] = useState(() => localStorage.getItem('k_supplier') || 'SUP-0188');
  const [ppapId, setPpapId] = useState(() => localStorage.getItem('k_ppap') || 'PPAP-2026-0042');

  // Auth gate
  const [signedIn, setSignedIn] = useState(() => localStorage.getItem('k_signed_in') === '1');
  const onSignIn = () => { localStorage.setItem('k_signed_in', '1'); setSignedIn(true); };
  const signOut = () => { localStorage.removeItem('k_signed_in'); setSignedIn(false); };

  // Live mode (real-time toasts)
  const [liveMode, setLiveMode] = useState(() => localStorage.getItem('k_live') === '1');
  const toggleLive = () => setLiveMode(v => {
    const next = !v; localStorage.setItem('k_live', next ? '1' : '0'); return next;
  });

  // Upload modal
  const [uploadOpen, setUploadOpen] = useState(false);

  const setRoute = (r) => { _setRoute(r); localStorage.setItem('k_route', r); };
  // Dev/test hook: allows deep-linking + automated route checks
  useEffect(() => { window.__navigate = (r) => setRoute(r); }, []);
  const setNcr = (id) => { setNcrId(id); localStorage.setItem('k_ncr', id); };
  const set8d = (id) => { set8dId(id); localStorage.setItem('k_8d', id); };
  const setInspection = (id) => { setInspectionId(id); localStorage.setItem('k_insp', id); };
  const setAudit = (id) => { setAuditId(id); localStorage.setItem('k_audit', id); };
  const setCapa = (id) => { setCapaId(id); localStorage.setItem('k_capa', id); };
  const setDoc = (id) => { setDocId(id); localStorage.setItem('k_doc', id); };
  const setReport = (id) => { setReportId(id); localStorage.setItem('k_report', id); };
  const setTemplate = (id) => { setTemplateId(id); localStorage.setItem('k_template', id); };
  const setSupplier = (id) => { setSupplierId(id); localStorage.setItem('k_supplier', id); };
  const setPpap = (id) => { setPpapId(id); localStorage.setItem('k_ppap', id); };

  // Settings with Tweaks persistence
  const [settings, setSettings] = useState(() => {
    const d = window.__TWEAK_DEFAULTS;
    return { ...d, ...JSON.parse(localStorage.getItem('k_settings') || '{}') };
  });
  const updateSettings = (patch) => {
    setSettings(s => {
      const next = { ...s, ...patch };
      localStorage.setItem('k_settings', JSON.stringify(next));
      try { window.parent.postMessage({ type: '__edit_mode_set_keys', edits: patch }, '*'); } catch(e) {}
      return next;
    });
  };

  // Apply theme + accent + density
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', settings.theme);
    document.documentElement.setAttribute('data-accent', settings.accent);
    document.documentElement.setAttribute('data-density', settings.density);
  }, [settings.theme, settings.accent, settings.density]);

  // Edit mode (Tweaks) wiring
  const [tweaksOpen, setTweaksOpen] = useState(false);
  useEffect(() => {
    const handle = (ev) => {
      if (ev.data?.type === '__activate_edit_mode') setTweaksOpen(true);
      if (ev.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', handle);
    try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch(e) {}
    return () => window.removeEventListener('message', handle);
  }, []);

  // AI drawer
  const [aiOpen, setAiOpen] = useState(false);

  // Create wizard
  const [createType, setCreateType] = useState(null); // null | 'inspection' | 'ncr' | '8d' | 'document'
  const openCreate = (type) => setCreateType(type || 'inspection');
  const closeCreate = () => setCreateType(null);
  const [toast, setToast] = useState(null);
  const onCreateComplete = (data) => {
    const label = ENTITY_TYPES[data.type].label;
    setToast(`✨ ${label} created — ${data.title}`);
    if (data.type === 'inspection') setRoute('inspection-detail');
    else if (data.type === 'ncr') setRoute('ncr-detail');
    else if (data.type === '8d') setRoute('8d-detail');
    else if (data.type === 'document') setRoute('document-detail');
  };

  // Command palette + notifications
  const [cmdOpen, setCmdOpen] = useState(false);
  const [notifsOpen, setNotifsOpen] = useState(false);
  useEffect(() => {
    const handler = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); setCmdOpen(true); }
      if ((e.metaKey || e.ctrlKey) && e.key === 'i') { e.preventDefault(); openCreate('inspection'); }
      if ((e.metaKey || e.ctrlKey) && e.key === 'd' && !e.shiftKey) { e.preventDefault(); openCreate('8d'); }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);
  const aiContext = (() => {
    if (route === 'dashboard') return 'Dashboard';
    if (route === 'inspections') return 'Inspections list';
    if (route === 'inspection-detail') return `Inspection ${inspectionId}`;
    if (route === 'ncr') return 'NCR list';
    if (route === 'ncr-detail') return `NCR ${ncrId}`;
    if (route === '8d') return '8D list';
    if (route === '8d-detail') return `8D ${eightDId}`;
    return route;
  })();

  const collapsed = settings.sidebar === 'collapsed';

  // Responsive shell: below 860px the sidebar becomes an off-canvas drawer.
  const isMobile = useIsMobile();
  const [drawerOpen, setDrawerOpen] = useState(false);
  // Close the drawer whenever the route changes or we leave mobile.
  useEffect(() => { setDrawerOpen(false); }, [route]);
  useEffect(() => { if (!isMobile) setDrawerOpen(false); }, [isMobile]);
  const onHamburger = () => isMobile
    ? setDrawerOpen((o) => !o)
    : updateSettings({ sidebar: collapsed ? 'expanded' : 'collapsed' });

  // Add-on entitlements — re-render when a pack is purchased/removed
  const entitlements = useEntitlements();

  const renderPage = () => {
    const inner = (() => {
    switch (route) {
      case 'dashboard': return <Dashboard setRoute={setRoute} setNcr={setNcr} set8d={set8d} setInspection={setInspection} openCreate={openCreate}/>;
      case 'inspections':
        return <InspectionsList setRoute={setRoute} setInspection={setInspection} openCreate={openCreate}/>;
      case 'inspections-templates':
        return <InspectionTemplatesList setRoute={setRoute} setTemplate={setTemplate}/>;
      case 'inspection-template-editor':
        return <InspectionTemplateEditor id={templateId} setRoute={setRoute}/>;
      case 'inspections-schedule':
        return <ScheduleView setRoute={setRoute} setInspection={setInspection} setAudit={setAudit} openCreate={openCreate}/>;
      case 'inspection-detail': return <InspectionDetail id={inspectionId} setRoute={setRoute} setNcr={setNcr}/>;
      case 'ncr':
      case 'ncr-mine':
      case 'ncr-overdue':
        return <NCRList route={route} setRoute={setRoute} setNcr={setNcr} openCreate={openCreate}/>;
      case 'ncr-detail': return <NCRDetail id={ncrId} setRoute={setRoute} setNcr={setNcr} set8d={set8d} setInspection={setInspection}/>;
      case '8d':
      case '8d-completed':
        return <EightDList setRoute={setRoute} set8d={set8d} openCreate={openCreate}/>;
      case '8d-templates':
        return <EightDTemplatesList setRoute={setRoute} setTemplate={setTemplate}/>;
      case '8d-template-editor':
        return <EightDTemplateEditor id={templateId} setRoute={setRoute}/>;
      case '8d-pdf': return <EightDPdfReport id={eightDId} setRoute={setRoute}/>;
      case '8d-detail': return <EightDDetail id={eightDId} setRoute={setRoute} setNcr={setNcr} set8d={set8d} setCapa={setCapa}/>;
      case 'audits':
      case 'audits-mine':
      case 'audits-schedule':
        return <AuditList setRoute={setRoute} setAudit={setAudit} openCreate={openCreate}/>;
      case 'audit-detail': return <AuditDetail id={auditId} setRoute={setRoute} setNcr={setNcr}/>;
      case 'capa':
      case 'capa-mine':
      case 'capa-overdue':
        return <CapaList setRoute={setRoute} setCapa={setCapa} openCreate={openCreate}/>;
      case 'capa-detail': return <CapaDetail id={capaId} setRoute={setRoute} setNcr={setNcr} set8d={set8d}/>;
      case 'documents': return <DocsList setRoute={setRoute} setDoc={setDoc} openCreate={openCreate} onUpload={() => setUploadOpen(true)}/>;
      case 'document-detail': return <DocDetail id={docId} setRoute={setRoute}/>;
      case 'reports': return <ReportsHub setRoute={setRoute} setReport={setReport}/>;
      case 'reports-dashboards': return <PrebuiltDashboards setRoute={setRoute} setReport={setReport}/>;
      case 'report-builder': return <ReportBuilder id={reportId} setRoute={setRoute}/>;
      case 'notifications': return <NotificationsCenter setRoute={setRoute} setNcr={setNcr} set8d={set8d} setAudit={setAudit} setCapa={setCapa} setInspection={setInspection}/>;
      case 'training': return <TrainingMatrix setRoute={setRoute}/>;
      case 'calibration': return <CalibrationManagement setRoute={setRoute}/>;
      case 'complaints': return <CustomerComplaints setRoute={setRoute} setNcr={setNcr}/>;
      case 'ecn': return <ECNWorkbench setRoute={setRoute}/>;
      case 'risk': return <RiskRegister setRoute={setRoute}/>;
      case 'fmea': return <FMEAWorkbench setRoute={setRoute}/>;
      case 'spc': return <SPCCharts setRoute={setRoute}/>;
      case 'msa': return <MSAStudy setRoute={setRoute}/>;
      case 'ai-governance': return <AIGovernanceHub setRoute={setRoute}/>;
      case 'dev-platform': return <DevPlatformHub setRoute={setRoute}/>;
      case 'multi-tenancy': return <MultiTenancyHub/>;
      case 'empty-states': return <EmptyStatesGallery setRoute={setRoute} openCreate={openCreate}/>;
      case 'skeletons': return <SkeletonsGallery setRoute={setRoute}/>;
      case 'suppliers': return <SupplierList setRoute={setRoute} setSupplier={setSupplier} openCreate={openCreate} settings={settings}/>;
      case 'suppliers-scorecards': return <SupplierScorecards setRoute={setRoute} setSupplier={setSupplier}/>;
      case 'suppliers-risk': return <SupplierRiskMatrix setRoute={setRoute} setSupplier={setSupplier} settings={settings}/>;
      case 'supplier-detail': return <SupplierDetail id={supplierId} setRoute={setRoute} setSupplier={setSupplier} setNcr={setNcr} set8d={set8d} setAudit={setAudit} setCapa={setCapa} settings={settings}/>;
      case 'ppap': return <PpapSubmissionsList setRoute={setRoute} setSupplier={setSupplier} setPpap={setPpap}/>;
      case 'ppap-detail': return <PpapDetail id={ppapId} setRoute={setRoute} setSupplier={setSupplier} settings={settings}/>;
      case 'scar': return <ScarWorkflow setRoute={setRoute} setSupplier={setSupplier} setNcr={setNcr} set8d={set8d}/>;
      case 'graph': return <GraphExplorer setRoute={setRoute} setNcr={setNcr} set8d={set8d} setCapa={setCapa} setInspection={setInspection} setSupplier={setSupplier} setAudit={setAudit} setDoc={setDoc}/>;
      case 'predictive': return <PredictiveRisk setRoute={setRoute} setSupplier={setSupplier} setNcr={setNcr}/>;
      case 'pqe': return <PQEModule setRoute={setRoute}/>;
      case 'settings': return <Settings setRoute={setRoute}/>;
      case 'pricing': return <PricingPage setRoute={setRoute}/>;
      case 'mobile': return <MobileInspectorPage setRoute={setRoute}/>;
      case 'quicklog': return <QuickLogPage setRoute={setRoute}/>;
      case 'supplier': return <SupplierPortal setRoute={setRoute}/>;
      case 'pdf-designer': return <PDFTemplateDesigner setRoute={setRoute}/>;
      default: return <Dashboard setRoute={setRoute} setNcr={setNcr} set8d={set8d} setInspection={setInspection}/>;
    }
    })();
    const lockedPackId = packForRoute(route);
    if (lockedPackId && isRouteLocked(route, entitlements)) {
      return <UpgradeOverlay packId={lockedPackId} setRoute={setRoute}>{inner}</UpgradeOverlay>;
    }
    return inner;
  };

  if (!signedIn) {
    return (
      <>
        <Auth onSignIn={onSignIn}/>
        <TweaksPanel open={tweaksOpen} settings={settings} update={updateSettings}/>
      </>
    );
  }

  return (
    <div style={{ display: 'flex', minHeight: '100vh', background: 'var(--bg)' }}>
      {isMobile && drawerOpen &&
        <div onClick={() => setDrawerOpen(false)}
          style={{ position: 'fixed', inset: 0, background: 'rgba(2,6,23,0.55)', zIndex: 65, backdropFilter: 'blur(1px)' }} />
      }
      <Sidebar collapsed={collapsed} onToggle={() => updateSettings({ sidebar: collapsed ? 'expanded' : 'collapsed' })}
        route={route} setRoute={setRoute} mobile={isMobile} open={drawerOpen} onClose={() => setDrawerOpen(false)}/>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 }}>
        <TopBar
          onToggleSidebar={onHamburger}
          mobile={isMobile}
          breadcrumbs={BREADCRUMBS[route] || [{ label: route }]}
          onToggleTheme={() => updateSettings({ theme: settings.theme === 'light' ? 'dark' : 'light' })}
          theme={settings.theme}
          onOpenAI={() => setAiOpen(true)} aiOpen={aiOpen}
          aiProminence={settings.ai}
          onOpenCmd={() => setCmdOpen(true)}
          onOpenNotifs={() => setNotifsOpen(true)}
          openCreate={openCreate}
          onOpenUpload={() => setUploadOpen(true)}
          liveMode={liveMode}
          onToggleLive={toggleLive}
          onSignOut={signOut}
          setRoute={setRoute}
        />
        <main style={{ flex: 1, minHeight: 0 }}>
          {renderPage()}
        </main>
      </div>

      <AIDrawer open={aiOpen} onClose={() => setAiOpen(false)} context={aiContext}/>
      <TweaksPanel open={tweaksOpen} settings={settings} update={updateSettings}/>
      {createType && <CreateWizard initialType={createType} onClose={closeCreate} onComplete={onCreateComplete}/>}
      <CommandPalette open={cmdOpen} onClose={() => setCmdOpen(false)} onCreate={openCreate} setRoute={setRoute}
        setNcr={setNcr} set8d={set8d} setInspection={setInspection} setAudit={setAudit} setCapa={setCapa}
        onToggleTheme={() => updateSettings({ theme: settings.theme === 'light' ? 'dark' : 'light' })}
        onOpenAI={() => setAiOpen(true)}/>
      <NotificationsPanel open={notifsOpen} onClose={() => setNotifsOpen(false)}
        onSeeAll={() => { setNotifsOpen(false); setRoute('notifications'); }}
        onOpenItem={(t) => {
          if (t.kind === 'ncr') { setNcr(t.id); setRoute('ncr-detail'); }
          else if (t.kind === '8d') { set8d(t.id); setRoute('8d-detail'); }
          else if (t.kind === 'audit') { setAudit(t.id); setRoute('audit-detail'); }
          else if (t.kind === 'capa') { setCapa(t.id); setRoute('capa-detail'); }
          else if (t.kind === 'inspection') { setInspection(t.id); setRoute('inspection-detail'); }
        }}/>
      {toast && <Toast message={toast} onClose={() => setToast(null)}/>}
      <UploadModal open={uploadOpen} onClose={() => setUploadOpen(false)} onComplete={() => setToast('✨ 4 documents uploaded · OCR & AI summary complete')}/>
      <LiveToastProvider enabled={liveMode} onOpenTarget={(t) => {
        if (t.kind === 'ncr') { setNcr(t.id); setRoute('ncr-detail'); }
        else if (t.kind === '8d') { set8d(t.id); setRoute('8d-detail'); }
        else if (t.kind === 'audit') { setAudit(t.id); setRoute('audit-detail'); }
        else if (t.kind === 'capa') { setCapa(t.id); setRoute('capa-detail'); }
        else if (t.kind === 'inspection') { setInspection(t.id); setRoute('inspection-detail'); }
        else if (t.kind === 'document') { setDoc(t.id); setRoute('document-detail'); }
      }}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
