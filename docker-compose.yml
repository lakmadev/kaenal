services:
  postgres:
    image: postgres:16-alpine
    container_name: kaenal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kaenal_migrator
      POSTGRES_PASSWORD: kaenal_local_pw
      POSTGRES_DB: kaenal
    ports:
      - "5433:5432"
    volumes:
      - kaenal-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaenal_migrator -d kaenal"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: kaenal-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - kaenal-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: kaenal-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kaenal
      MINIO_ROOT_PASSWORD: kaenal_local_pw
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - kaenal-miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Local inspection UIs — dev only, not part of the app runtime.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: kaenal-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@kaenal.dev
      PGADMIN_DEFAULT_PASSWORD: kaenal_local_pw
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - kaenal-pgadmindata:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  redisinsight:
    image: redis/redisinsight:latest
    container_name: kaenal-redisinsight
    restart: unless-stopped
    ports:
      - "8081:5540"
    volumes:
      - kaenal-redisinsightdata:/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  kaenal-pgdata:
  kaenal-redisdata:
  kaenal-miniodata:
  kaenal-pgadmindata:
  kaenal-redisinsightdata:
