# Maestro E2E — post-sign-in navigation smoke (05 §8).
# Assumes an authenticated session (run sign-in.yaml first, or reuse app state).
# Exercises tab navigation, the notification centre + deep-link, and the capture FAB —
# the four surfaces M13 touched — asserting each screen renders without crashing.
appId: com.kaenal.mobile
---
- launchApp
# The home dashboard header carries the notifications bell.
- assertVisible: "Me"

# Notification centre (M13.1): open, and if a linkable row exists, tapping it must
# navigate without crashing (deep-link resolver). Empty state is also acceptable.
- tapOn:
    id: "Notifications"
- assertVisible:
    text: "Notifications"
- takeScreenshot: notifications
- back

# Capture FAB (center tab) — the quick-log entry point.
- tapOn:
    id: "Capture"
- takeScreenshot: capture
- back

# Round-trip the primary tabs. "Me" is present for every role; the middle tabs vary,
# so we only assert on the always-present anchors.
- tapOn: "Me"
- assertVisible: "Settings"
- tapOn: "Home"
- assertVisible: "Me"
